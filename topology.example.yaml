apiVersion: netlattice/v1
kind: Site
metadata:
  name: home-lab
spec:
  domains:
    internal: home.arpa
    public: example.com
  networks:
    lan:
      cidr: 192.168.10.0/24
      gateway: 192.168.10.1
      dns: 192.168.10.2
    vpn:
      cidr: 10.44.0.0/24
  nodes:
    - name: edge-1
      role: edge
      address: 192.168.10.2
    - name: pve-1
      role: compute
      address: 192.168.10.10
  modules:
    dns:
      enabled: true
      provider: adguard
      admin_port: 3000
      upstreams:
        - 1.1.1.1
        - 9.9.9.9
      records:
        - name: pve.home.arpa
          type: A
          value: 192.168.10.10
        - name: nas.home.arpa
          type: A
          value: 192.168.10.20
    vpn:
      enabled: true
      provider: wireguard
      endpoint: vpn.example.com:51820
      interface: wg0
      peers:
        - name: laptop
          allowed_ips:
            - 10.44.0.2/32
        - name: phone
          allowed_ips:
            - 10.44.0.3/32
    compute:
      enabled: true
      provider: proxmox
      api_url: https://pve-1.home.arpa:8006
      templates:
        - name: debian-12
          vmid: 9001
          os: linux
          cloud_init: true
        - name: windows-ltsc
          vmid: 9002
          os: windows
          cloud_init: false
