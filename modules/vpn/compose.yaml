services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:15
    container_name: netlattice-wg-easy
    restart: unless-stopped
    environment:
      WG_HOST: ${WG_HOST:?set WG_HOST in .env}
      PASSWORD_HASH: ${WG_ADMIN_PASSWORD_HASH:?set WG_ADMIN_PASSWORD_HASH in .env}
      WG_PORT: "51820"
      WG_DEFAULT_DNS: ${WG_DEFAULT_DNS:-192.168.10.2}
      WG_ALLOWED_IPS: ${WG_ALLOWED_IPS:-192.168.10.0/24,10.44.0.0/24}
      WG_PERSISTENT_KEEPALIVE: "25"
    volumes:
      - ./data:/etc/wireguard
    ports:
      - "51820:51820/udp"
      - "${VPN_ADMIN_BIND:-127.0.0.1}:51821:51821/tcp"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    labels:
      netlattice.module: vpn
      netlattice.managed: "true"
