services:
  adguardhome:
    image: adguard/adguardhome:latest
    container_name: netlattice-adguard
    restart: unless-stopped
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "${DNS_ADMIN_BIND:-127.0.0.1}:3000:3000/tcp"
    volumes:
      - ./work:/opt/adguardhome/work
      - ./conf:/opt/adguardhome/conf
    labels:
      netlattice.module: dns
      netlattice.managed: "true"
