services:
  console:
    build:
      context: ..
      dockerfile: console/Dockerfile
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      NETLATTICE_TOPOLOGY: /app/topology.yaml
    volumes:
      - ../topology.example.yaml:/app/topology.yaml:ro
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/api/health', timeout=2)"
      interval: 30s
      timeout: 5s
      retries: 3
