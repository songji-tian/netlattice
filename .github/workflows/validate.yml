name: validate

on:
  push:
  pull_request:

jobs:
  topology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml
      - name: Validate examples
        run: |
          for f in examples/*.yaml topology.example.yaml; do
            python scripts/validate_topology.py "$f"
          done
