name: validate

on:
  push:
  pull_request:

jobs:
  topology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml
      - name: Validate examples
        run: |
          for f in examples/*.yaml topology.example.yaml; do
            python scripts/validate_topology.py "$f"
          done

  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r console/requirements.txt -r tests/requirements.txt
      - name: Run console tests
        run: python -m unittest discover -s tests -v
      - name: Validate compose file
        run: docker compose -f console/compose.yaml config >/dev/null
